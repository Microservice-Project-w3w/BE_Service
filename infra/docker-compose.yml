services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-change-me}
      TZ: Asia/Ho_Chi_Minh
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./mysql/init/01-core-service-schema.sql:/docker-entrypoint-initdb.d/01-core-service-schema.sql:ro
      - ./mysql/init/02-customer-portal.sql:/docker-entrypoint-initdb.d/02-customer-portal.sql:ro
      - ./mysql/migrations/20261011_demo_operations.sql:/docker-entrypoint-initdb.d/03-demo-operations.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -p$${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 12

  ollama:
    image: ollama/ollama:latest
    profiles: ["ai"]
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama

volumes:
  mysql-data:
  ollama-data:
