server:
  port: ${SERVER_PORT:8082}
spring:
  application.name: organization-customer-service
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/organization_customer_db?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=utf8
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:${MYSQL_ROOT_PASSWORD:change-me}}
  jpa:
    hibernate.ddl-auto: validate
    open-in-view: false
  flyway:
    # Schema này được khởi tạo bởi infra/mysql/init/01-core-service-schema.sql.
    # Không chạy lại V1 trên cùng database vì sẽ tạo trùng bảng.
    enabled: false
    locations: classpath:db/migration
security:
  jwt:
    issuer: ${JWT_ISSUER:identity-service}
    secret-base64: ${JWT_SECRET_BASE64:VGhpc0lzTXlTdXBlclNlY3JldEtleUZvckp3dDIwMjQhISE=}

management:
  endpoints.web.exposure.include: health,info
  endpoint.health.show-details: always

app:
  integration:
    identity-base-url: ${IDENTITY_SERVICE_URL:http://localhost:8081}
