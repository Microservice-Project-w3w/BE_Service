server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      routes:
        # ==================================================
        # IDENTITY SERVICE - PORT 8081
        # ==================================================

        # Đăng ký, đăng nhập, refresh token, xác minh email...
        - id: identity-auth
          uri: ${IDENTITY_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/v1/auth,/api/v1/auth/**

        # Quản lý role, permission, user và session
        - id: identity-management
          uri: ${IDENTITY_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/v1/roles,/api/v1/roles/**,/api/v1/permissions,/api/v1/permissions/**,/api/v1/users,/api/v1/users/**,/api/v1/sessions,/api/v1/sessions/**

        # Health của Identity
        - id: identity-health
          uri: ${IDENTITY_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/gateway/health/identity
          filters:
            - SetPath=/health

        # ==================================================
        # RENTAL SERVICE - PORT 8084
        # ==================================================

        # Bảng giá và mã giảm giá
        - id: rental-pricing
          uri: ${RENTAL_SERVICE_URL:http://localhost:8084}
          predicates:
            - Path=/api/v1/rental-prices,/api/v1/rental-prices/**,/api/v1/discount-codes,/api/v1/discount-codes/**

        # Tra cứu thiết bị và quy trình thuê
        - id: rental-workflow
          uri: ${RENTAL_SERVICE_URL:http://localhost:8084}
          predicates:
            - Path=/api/v1/availability,/api/v1/equipment/search,/api/v1/rental-requests,/api/v1/rental-requests/**,/api/v1/quotations,/api/v1/quotations/**,/api/v1/rental-orders,/api/v1/rental-orders/**

        # Hợp đồng, phụ lục và gia hạn
        - id: rental-contract
          uri: ${RENTAL_SERVICE_URL:http://localhost:8084}
          predicates:
            - Path=/api/v1/rental-contracts,/api/v1/rental-contracts/**

        # Health của Rental
        - id: rental-health
          uri: ${RENTAL_SERVICE_URL:http://localhost:8084}
          predicates:
            - Path=/gateway/health/rental
          filters:
            - SetPath=/health

      # Tránh lặp header CORS nếu service phía sau cũng trả CORS
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin RETAIN_UNIQUE

      # Cho phép frontend React gọi Gateway
      globalcors:
        add-to-simple-url-handler-mapping: true
        cors-configurations:
          '[/**]':
            allowedOrigins:
              - ${FRONTEND_URL:http://localhost:5173}
            allowedMethods:
              - GET
              - POST
              - PUT
              - PATCH
              - DELETE
              - OPTIONS
            allowedHeaders:
              - "*"
            exposedHeaders:
              - Authorization
              - X-Trace-Id
            allowCredentials: true
            maxAge: 3600

management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - info

  endpoint:
    health:
      show-details: always